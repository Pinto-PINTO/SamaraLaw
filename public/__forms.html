<!DOCTYPE html>
<html>
  <body>
    <!-- Hidden form so Netlify detects the "case-evaluation" form at deploy time. -->
    <form name="case-evaluation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="case-evaluation" />
      <input name="bot-field" />
      <input name="name" />
      <input name="contact" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
